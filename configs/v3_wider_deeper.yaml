# KLA Image Restoration — Large Model Config (v3)
# For ablation: bigger model to test if capacity is the bottleneck
# ~0.63M params — still well within the 3-8M target range

# Model
width: 96
num_blocks: 12
uncertainty: false

# Training
batch_size: 8       # smaller batch to fit larger model in GPU memory
epochs: 200
lr: 0.0002
min_lr: 0.000001
weight_decay: 0.0001
ema_decay: 0.999

# Dataset
crop_size: 64
synthetic_ratio: 0.7
use_cutblur: true
augment: true

# Losses — same as v2
use_nll: false
use_msssim: true
use_fft: true
use_lpips: false
use_gradient: true
use_forward: false
w_charb: 1.0
w_msssim: 0.1
w_fft: 0.1
w_grad: 0.1

# Paths
output_dir: checkpoints/v3_wider_deeper
