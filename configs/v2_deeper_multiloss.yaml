# KLA Image Restoration — Improved Training Config (v2)
# Changes from baseline:
#   - Larger model: width=64 → 64, num_blocks=4 → 12 (~0.32M params)
#   - Enabled losses: FFT, gradient, MS-SSIM
#   - Longer schedule: 200 epochs with cosine decay (LR won't bottom out early)
#   - Higher synthetic ratio for OOD generalization

# Model
width: 64
num_blocks: 12
uncertainty: false

# Training
batch_size: 16
epochs: 200
lr: 0.0002
min_lr: 0.000001
weight_decay: 0.0001
ema_decay: 0.999

# Dataset
crop_size: 64
synthetic_ratio: 0.7
use_cutblur: true
augment: true

# Losses
use_nll: false
use_msssim: true
use_fft: true
use_lpips: false    # enable later — requires lpips pip package + VGG download
use_gradient: true
use_forward: false   # currently has implementation issues
w_charb: 1.0
w_msssim: 0.1
w_fft: 0.1
w_grad: 0.1

# Paths
output_dir: checkpoints/v2_deeper_multiloss
